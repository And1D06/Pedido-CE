<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b6e76">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Pedido de Insumos CE</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: catálogo en columna ancha a la izquierda, pedido fijo a la derecha; en celular el pedido queda debajo con barra inferior de acceso. */
:root{
  --bg:#f3f6f7; --surface:#ffffff; --ink:#14262b; --muted:#5b6f75; --line:#d5dfe2;
  --accent:#0b6e76; --accent-ink:#ffffff; --accent-soft:#dff0f1;
  --warn:#8a5a00; --warn-soft:#fbefd2; --ok:#1d6b3a;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-code:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1b1e; --surface:#16272b; --ink:#e4eef0; --muted:#93a9ae; --line:#27403f;
  --accent:#4fc1c9; --accent-ink:#06282b; --accent-soft:#17383b;
  --warn:#f0c15a; --warn-soft:#3a2f12; --ok:#6fd195; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1b1e; --surface:#16272b; --ink:#e4eef0; --muted:#93a9ae; --line:#27403f;
  --accent:#4fc1c9; --accent-ink:#06282b; --accent-soft:#17383b;
  --warn:#f0c15a; --warn-soft:#3a2f12; --ok:#6fd195; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:20px 90px}
.wrap{max-width:1180px;margin:0 auto}
header{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;justify-content:space-between;margin-bottom:16px}
h1{font-size:22px;font-weight:600;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
@media(max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px}
.tools{padding:12px;display:flex;flex-direction:column;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:3;border-bottom:1px solid var(--line);background:var(--surface);border-radius:6px 6px 0 0}
input,textarea,select,button{font:inherit;color:var(--ink)}
input[type=text],input[type=search],input[type=email],input[type=date],textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px 10px;min-width:0}
input:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 10px;font-size:13px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.count{font-size:12px;color:var(--muted)}
ul.items{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;padding:12px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.code{font-family:var(--f-code);font-weight:600;font-size:15px;color:var(--accent);letter-spacing:.02em}
.name{font-weight:500;overflow-wrap:anywhere}
.meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.meta .mono{font-family:var(--f-code)}
.tag{background:var(--warn-soft);color:var(--warn);border-radius:3px;padding:0 6px;font-size:11px;font-weight:600}
details summary{cursor:pointer;color:var(--accent);font-size:12px;width:fit-content}
details p{margin:6px 0 0;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.add{display:flex;align-items:flex-start;gap:6px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:4px;padding:7px 12px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{padding:4px 9px;font-weight:500}
.qty{width:64px;text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:7px 4px;font-variant-numeric:tabular-nums}
.inorder{color:var(--ok);font-size:12px;font-weight:600}
aside .panel{position:sticky;top:12px}
@media(max-width:900px){aside .panel{position:static}}
.side{padding:14px;display:flex;flex-direction:column;gap:12px}
.side h2{font-size:16px;margin:0;font-weight:600}
.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:420px){.row2{grid-template-columns:1fr}}
.lines{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:4px}
.lines li{padding:8px 10px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px}
.lines li:last-child{border-bottom:0}
.lines .name{font-size:13px}
.lines input.note{grid-column:1/-1;font-size:12px;padding:5px 8px}
.empty{padding:14px;color:var(--muted);font-size:13px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.preview{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:10px;font-family:var(--f-code);font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:260px;overflow:auto}
.msg{font-size:12px;color:var(--muted)}
.msg b{color:var(--ink)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);display:none;justify-content:space-between;align-items:center;z-index:5}
@media(max-width:900px){.bar{display:flex}}
@media(prefers-reduced-motion:no-preference){.btn{transition:opacity .15s}}
a.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
a.btn.off{opacity:.45;pointer-events:none}
.step{display:flex;align-items:stretch}
.step button{width:36px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:18px;line-height:1;padding:0}
.step button:first-child{border-radius:4px 0 0 4px}
.step button:last-child{border-radius:0 4px 4px 0}
.step .qty{border-radius:0;width:52px;border-inline:0}
.back{display:none;font-size:13px;color:var(--accent)}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px}
@media(max-width:900px){
  body{padding-bottom:96px}
  input,textarea{font-size:16px!important}
  .btn,.step button,.step .qty{min-height:44px}
  .step button{width:44px}
  .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .chip{flex:none;white-space:nowrap;min-height:36px;padding-inline:14px}
  .item{grid-template-columns:minmax(0,1fr);padding:14px 12px}
  .item .add{justify-content:space-between}
  .item .add .btn{flex:1}
  .actions .btn{flex:1 1 100%}
  .back{display:inline}
  .lines li{grid-template-columns:minmax(0,1fr)}
  .lines .add{justify-content:space-between}
}
</style>

</head>
<body>
<div class="wrap" id="top">
  <header>
    <h1>Pedido de insumos · Central de Esterilización</h1>
    <span class="sub">Catálogo actualizado · <span id="total"></span> artículos</span>
  </header>
  <div class="grid">
    <main class="panel">
      <div class="tools">
        <input type="search" id="q" placeholder="Buscar por código, medida o descripción (ej: 52575, tyvek 10 cm, cinta plasma)" aria-label="Buscar">
        <div class="chips" id="chips"></div>
        <div class="count" id="count"></div>
      </div>
      <ul class="items" id="list"></ul>
    </main>
    <aside>
      <div class="panel side" id="order">
        <div class="head"><h2>Mi pedido</h2><a class="back" href="#top">↑ Volver al catálogo</a></div>
        <div class="row2">
          <label class="f" for="who">Solicitante<input type="text" id="who" placeholder="Nombre y apellido"></label>
          <label class="f" for="date">Fecha<input type="date" id="date"></label>
        </div>
        <label class="f" for="to">Enviar a (mail del comprador)<input type="email" id="to" placeholder="compras@hospital.gob.ar"></label>
        <ul class="lines" id="lines"></ul>
        <label class="f" for="obs">Observaciones<textarea id="obs" rows="2" placeholder="Urgencia, entrega, aclaraciones"></textarea></label>
        <div class="actions">
          <button class="btn" id="mail" type="button">Abrir en mi correo</button>
          <a class="btn ghost" id="wa" href="#order" target="_blank" rel="noopener">Enviar por WhatsApp</a>
          <button class="btn ghost" id="copy" type="button">Copiar texto del mail</button>
          <button class="btn ghost" id="clear" type="button">Vaciar</button>
        </div>
        <div class="msg" id="msg" role="status"></div>
        <details>
          <summary>Ver el texto del mail</summary>
          <div class="preview" id="preview"></div>
        </details>
      </div>
    </aside>
  </div>
</div>
<div class="bar"><span id="barcount"></span><a class="btn" href="#order" style="text-decoration:none">Ver pedido</a></div>

const $ = id => document.getElementById(id);
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
let order = {};        // code -> {qty, note}
let cat = 'Todos';
const byCode = Object.fromEntries(CATALOG.map(i => [i.code, i]));
const cats = ['Todos', ...Array.from(new Set(CATALOG.map(i => i.cat)))];

function store(op, k, v){ try{ if(op==='get') return localStorage.getItem(k); localStorage.setItem(k, v);}catch(e){return null} }
try{ order = JSON.parse(store('get','pedido-ce')||'{}') || {}; }catch(e){ order = {}; }
for(const c of Object.keys(order)) if(!byCode[c]) delete order[c];
['who','to','obs'].forEach(id => { const v = store('get','ce-'+id); if(v) $(id).value = v; $(id).addEventListener('input', () => { store('set','ce-'+id,$(id).value); renderMail(); }); });
$('date').value = new Date().toISOString().slice(0,10);
$('date').addEventListener('input', renderMail);
$('total').textContent = CATALOG.length;

function save(){ store('set','pedido-ce', JSON.stringify(order)); }

function renderChips(){
  $('chips').innerHTML = '';
  cats.forEach(c => {
    const b = document.createElement('button'); b.type='button'; b.className='chip'; b.textContent = c;
    b.setAttribute('aria-pressed', String(c===cat));
    b.onclick = () => { cat = c; renderChips(); renderList(); };
    $('chips').appendChild(b);
  });
}

function nneText(i){ return i.nne.length ? i.nne.join(' | ') : null; }

function renderList(){
  const terms = norm($('q').value).split(/\s+/).filter(Boolean);
  const res = CATALOG.filter(i => (cat==='Todos'||i.cat===cat) && terms.every(t => norm(i.code+' '+i.name+' '+i.full+' '+i.nne.join(' ')).includes(t)));
  $('count').textContent = res.length + ' de ' + CATALOG.length + ' artículos';
  const ul = $('list'); ul.innerHTML = '';
  if(!res.length){ ul.innerHTML = '<li class="empty">Ningún artículo coincide. Probá con menos palabras o con el código.</li>'; return; }
  res.forEach(i => {
    const li = document.createElement('li'); li.className = 'item';
    const nne = nneText(i);
    const inO = order[i.code];
    li.innerHTML = `<div>
        <div class="code">${i.code}</div>
        <div class="name"></div>
        <div class="meta"><span>${i.cat}</span>${nne?`<span>NNE <span class="mono">${nne}</span></span>`:'<span class="tag">Sin NNE</span>'}${inO?`<span class="inorder">En pedido: ${inO.qty}</span>`:''}</div>
        <details><summary>Ver descripción completa</summary><p></p></details>
      </div>
      <div class="add"><div class="step"><button type="button" class="dec" aria-label="Menos">−</button><input class="qty" type="number" inputmode="numeric" min="1" step="1" value="1" aria-label="Cantidad de ${i.code}"><button type="button" class="inc" aria-label="Más">+</button></div><button class="btn add-btn" type="button">Agregar</button></div>`;
    li.querySelector('.name').textContent = i.name;
    li.querySelector('details p').textContent = i.full;
    const qty = li.querySelector('.qty');
    li.querySelector('.dec').onclick = () => { qty.value = Math.max(1, (parseInt(qty.value)||1) - 1); };
    li.querySelector('.inc').onclick = () => { qty.value = (parseInt(qty.value)||0) + 1; };
    li.querySelector('.add-btn').onclick = () => {
      const n = Math.max(1, parseInt(qty.value)||1);
      order[i.code] = { qty: (order[i.code]?.qty||0) + n, note: order[i.code]?.note||'' };
      save(); renderAll(); $('msg').innerHTML = '<b>'+i.code+'</b> agregado.';
    };
    ul.appendChild(li);
  });
}

function renderLines(){
  const ul = $('lines'); ul.innerHTML = '';
  const codes = Object.keys(order);
  if(!codes.length){ ul.outerHTML = '<ul class="lines" id="lines"><li class="empty" style="display:block">Todavía no agregaste artículos. Buscá en el catálogo y presioná "Agregar".</li></ul>'; return; }
  codes.forEach(c => {
    const i = byCode[c], o = order[c];
    const li = document.createElement('li');
    li.innerHTML = `<div><div class="code" style="font-size:13px">${c}</div><div class="name"></div></div>
      <div class="add"><div class="step"><button type="button" class="dec" aria-label="Menos">−</button><input class="qty" type="number" inputmode="numeric" min="1" step="1" value="${o.qty}" aria-label="Cantidad de ${c}"><button type="button" class="inc" aria-label="Más">+</button></div><button class="btn ghost small rm" type="button" aria-label="Quitar ${c}">Quitar</button></div>
      <input class="note qty" style="width:100%;text-align:left" type="text" placeholder="Nota (presentación, marca, urgencia)" value="">`;
    li.querySelector('.name').textContent = i.name;
    li.querySelector('.note').value = o.note || '';
    const qi = li.querySelector('input.qty');
    const setQ = n => { o.qty = Math.max(1, n); qi.value = o.qty; save(); renderMail(); renderBar(); };
    qi.oninput = e => { o.qty = Math.max(1, parseInt(e.target.value)||1); save(); renderMail(); renderBar(); };
    li.querySelector('.dec').onclick = () => setQ(o.qty - 1);
    li.querySelector('.inc').onclick = () => setQ(o.qty + 1);
    li.querySelector('.note').oninput = e => { o.note = e.target.value; save(); renderMail(); };
    li.querySelector('.rm').onclick = () => { delete order[c]; save(); renderAll(); };
    ul.appendChild(li);
  });
}

  codes.forEach(c => {
    const i = byCode[c], o = order[c];
    L.push(`${c} | ${o.qty} | ${i.name} | ${i.nne.length?i.nne.join(' / '):'sin NNE'}` + (o.note?` | Nota: ${o.note}`:''));
  });
  L.push('');
  L.push('Total: ' + codes.length + ' artículos, ' + codes.reduce((s,c)=>s+order[c].qty,0) + ' unidades');
  if($('obs').value.trim()){ L.push(''); L.push('Observaciones: ' + $('obs').value.trim()); }
  L.push(''); L.push('Verificar el código de cada línea antes de comprar.');
  return L.join('\n');
}
function subject(){ return 'Pedido de insumos CE - ' + ($('date').value.split('-').reverse().join('/')) + ($('who').value?' - '+$('who').value:''); }

function renderMail(){
  const has = Object.keys(order).length>0;
  $('preview').textContent = has ? 'Asunto: ' + subject() + '\n\n' + mailText() : 'El texto aparece cuando agregues artículos.';
  $('mail').disabled = !has; $('copy').disabled = !has; $('clear').disabled = !has;
  $('wa').classList.toggle('off', !has);
  $('wa').href = has ? 'https://wa.me/?text=' + encodeURIComponent(subject() + '\n\n' + mailText()) : '#order';
}
function renderBar(){
  const n = Object.keys(order).length, u = Object.values(order).reduce((s,o)=>s+o.qty,0);
  $('barcount').textContent = n ? n+(n===1?' artículo':' artículos')+' · '+u+(u===1?' unidad':' unidades') : 'Pedido vacío';
}
function renderAll(){ renderList(); renderLines(); renderMail(); renderBar(); }

$('q').addEventListener('input', renderList);
$('clear').onclick = () => { order = {}; save(); renderAll(); $('msg').textContent = 'Pedido vaciado.'; };
$('mail').onclick = () => {
  const body = mailText(), to = $('to').value.trim();
  const url = 'mailto:' + encodeURIComponent(to).replace('%40','@') + '?subject=' + encodeURIComponent(subject()) + '&body=' + encodeURIComponent(body);
  if(url.length > 1900){ $('msg').innerHTML = '<b>El pedido es largo para abrirlo directo.</b> Usá "Copiar texto del mail" y pegalo en un mail nuevo.'; return; }
  window.location.href = url;
  $('msg').innerHTML = 'Se intentó abrir tu programa de correo. Si no se abrió, usá "Copiar texto del mail". <b>El pedido no se envía hasta que lo mandes desde tu correo.</b>';
};
$('copy').onclick = async () => {
  const txt = (to=>('Para: '+(to||'(completar)')+'\n'))($('to').value.trim()) + 'Asunto: ' + subject() + '\n\n' + mailText();
  try{ await navigator.clipboard.writeText(txt); $('msg').textContent = 'Texto copiado. Pegalo en un mail nuevo.'; }
  catch(e){ const d = document.querySelector('details'); document.querySelectorAll('details')[document.querySelectorAll('details').length-1].open = true;
    const r = document.createRange(); r.selectNodeContents($('preview')); const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    $('msg').textContent = 'No se pudo copiar automáticamente. El texto quedó seleccionado: copialo con Ctrl+C.'; }
};

renderChips(); renderAll();
</script>

<script>
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){});});
}
</script>
